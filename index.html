<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Family Time Machine - Interactive English Learning Media</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: '#15365B',
                        mediumBlue: '#477DB3',
                        softBlue: '#E5F1FF',
                        warmCream: '#FFF1CF',
                        coralSoft: '#FF8A8A',
                        successGreen: '#2ECC71'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp {
            from { transform: translateY(15px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #E5F1FF; }
        ::-webkit-scrollbar-thumb { background: #477DB3; border-radius: 4px; }
    </style>
</head>
<body class="bg-softBlue text-navy min-h-screen flex flex-col selection:bg-mediumBlue selection:text-white">

    <!-- Top Navigation Header -->
    <header id="mainHeader" class="bg-navy text-white shadow-md sticky top-0 z-40 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="app.navigateTo(0)">
                <div class="bg-mediumBlue p-2.5 rounded-xl shadow-inner text-white text-xl flex items-center justify-center">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight tracking-wide">THE FAMILY TIME MACHINE</h1>
                    <p class="text-xs text-warmCream font-medium">Grade 8 English | 50-Min Lesson Media</p>
                </div>
            </div>

            <!-- Quick Module Navigation Bar -->
            <nav class="hidden lg:flex items-center space-x-1 bg-white/10 p-1 rounded-xl text-xs font-semibold overflow-x-auto">
                <button onclick="app.navigateTo(0)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="0">Home</button>
                <button onclick="app.navigateTo(1)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="1">1. Vocab</button>
                <button onclick="app.navigateTo(2)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="2">2. Tree</button>
                <button onclick="app.navigateTo(3)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="3">3. Listening</button>
                <button onclick="app.navigateTo(4)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="4">4. Grammar</button>
                <button onclick="app.navigateTo(5)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="5">5. Years</button>
                <button onclick="app.navigateTo(6)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="6">6. Speaking</button>
                <button onclick="app.navigateTo(7)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="7">7. Challenge</button>
                <button onclick="app.navigateTo(8)" class="nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20" data-mod="8">8. Summary</button>
            </nav>

            <!-- Mode Controls -->
            <div class="flex items-center space-x-2">
                <button onclick="app.toggleTeacherMode()" class="bg-warmCream text-navy font-bold px-3 py-1.5 rounded-xl text-xs hover:bg-amber-300 transition shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-chalkboard-user"></i> <span id="teacherModeBtnText">Teacher Mode</span>
                </button>
                <button onclick="app.printLKM()" class="bg-white text-navy font-bold px-3 py-1.5 rounded-xl text-xs hover:bg-softBlue transition shadow flex items-center gap-1.5 border border-blue-200" title="Cetak Lembar Kerja Murid">
                    <i class="fa-solid fa-print"></i> <span>Cetak LKM</span>
                </button>
                <button onclick="app.togglePresentMode()" id="presentModeBtn" class="bg-mediumBlue text-white font-bold px-3 py-1.5 rounded-xl text-xs hover:bg-blue-600 transition shadow flex items-center gap-1.5">
                    <i class="fa-solid fa-expand"></i> <span id="presentModeBtnText">Present</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main App Container -->
    <div class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col">

        <!-- Time & Progress Indicator Bar -->
        <div id="statusBar" class="bg-white rounded-2xl p-4 shadow-sm mb-6 flex flex-col md:flex-row items-center justify-between gap-4 border border-blue-100">
            <div class="flex items-center space-x-3">
                <div id="moduleBadge" class="bg-mediumBlue text-white font-bold px-3 py-1 rounded-xl text-xs">
                    Module 0 / 8
                </div>
                <div>
                    <h2 id="moduleTitleHeader" class="font-bold text-navy text-base md:text-lg">Welcome to The Family Time Machine</h2>
                    <p id="moduleTimeHeader" class="text-xs text-gray-500 font-medium"><i class="fa-regular fa-clock mr-1"></i> Estimated Time: 0 min</p>
                </div>
            </div>
            <div class="flex items-center gap-2 w-full md:w-auto justify-end">
                <button onclick="app.prevModule()" id="prevBtn" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-xl text-xs font-bold hover:bg-gray-300 transition flex items-center gap-1">
                    <i class="fa-solid fa-arrow-left"></i> Previous
                </button>
                <button onclick="app.stopSpeaking()" class="px-4 py-2 rounded-xl border border-blue-200 text-navy bg-white hover:bg-blue-50 text-xs font-bold" title="Stop audio"><i class="fa-solid fa-stop mr-1"></i> Stop Audio</button>
                <button onclick="app.nextModule()" id="nextBtn" class="px-4 py-2 bg-mediumBlue text-white rounded-xl text-xs font-bold hover:bg-blue-600 transition flex items-center gap-1 shadow">
                    Next <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>
        </div>

        <!-- Content Area -->
        <main id="mainContent" class="flex-1 flex flex-col">
            <!-- Dynamically rendered via JS -->
        </main>
    </div>

    <!-- Teacher Mode Drawer / Modal -->
    <div id="teacherModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden slide-up border-4 border-mediumBlue">
            <div class="bg-navy text-white p-4 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-chalkboard-user text-warmCream text-xl"></i>
                    <h3 class="font-bold text-lg">Teacher Mode & Lesson Notes</h3>
                </div>
                <button onclick="app.toggleTeacherMode()" class="text-white hover:text-warmCream text-lg font-bold px-2 py-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div id="teacherModalContent" class="p-6 overflow-y-auto space-y-4 text-sm text-gray-700">
                <!-- Populated dynamically per module -->
            </div>
            <div class="bg-gray-50 p-4 border-t flex justify-end">
                <button onclick="app.toggleTeacherMode()" class="bg-navy text-white px-5 py-2 rounded-xl text-xs font-bold hover:bg-blue-900 transition">Close Guide</button>
            </div>
        </div>
    </div>

    <!-- Notification / Message Box (Custom alert replacement) -->
    <div id="messageModal" class="fixed inset-0 bg-black/40 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl slide-up text-center border-t-8 border-mediumBlue">
            <div id="msgIcon" class="text-4xl text-mediumBlue mb-3"><i class="fa-solid fa-circle-info"></i></div>
            <h4 id="msgTitle" class="font-bold text-lg text-navy mb-2">Notice</h4>
            <p id="msgBody" class="text-sm text-gray-600 mb-6">Message goes here.</p>
            <button onclick="app.closeMessage()" class="w-full bg-navy text-white py-2.5 rounded-xl font-bold text-sm hover:bg-blue-900 transition shadow">Got It</button>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-navy text-white/70 py-4 text-center text-xs border-t border-white/10 mt-8">
        <p>The Family Time Machine | Designed for Grade 8 Regular English (50-Minute Lesson)</p>
    </footer>

    <!-- Application Logic Script -->
    <script>
        // Application State
        const state = {
            currentModule: 0,
            presentMode: false,
            teacherModeOpen: false,
            quizScore: 0,
            quizAnswers: {},
            quizSubmitted: false,
            vocabMatched: {},
            grammarAnswers: { l1: {}, l2: {}, l3: {} },
            listeningRevealed: false,
            yearRevealed: {}
        };

        // Comprehensive Fictional Family Tree Data & Relationships
        const familyMembers = [
            { id: 'nathan', name: 'Nathan', relation: 'Grandfather / Husband', desc: 'Nathan is Sally\'s husband. He was a photographer in his youth.', details: 'Nathan was born in 1945. He loves taking photos of his family.' },
            { id: 'sally', name: 'Sally', relation: 'Grandmother / Wife', desc: 'Sally is Nathan\'s wife. She was a doctor.', details: 'Sally and Nathan were married in 1968.' },
            { id: 'mary', name: 'Mary', relation: 'Mother / Daughter', desc: 'Mary is Nathan and Sally\'s daughter. Greg\'s mother.', details: 'Mary is married to Michael. She is Greg and Ella\'s mother.' },
            { id: 'michael', name: 'Michael', relation: 'Father / Husband', desc: 'Michael is Mary\'s husband. Greg and Ella\'s father.', details: 'Michael works as an engineer. He was born in 1970.' },
            { id: 'greg', name: 'Greg', relation: 'Son / Brother', desc: 'Greg is Mary and Michael\'s son. Ella\'s brother.', details: 'Greg is a student in Grade 8. He likes history.' },
            { id: 'ella', name: 'Ella', relation: 'Daughter / Sister', desc: 'Ella is Mary and Michael\'s daughter. Greg\'s sister.', details: 'Ella is Greg\'s younger sister. She loves reading.' },
            { id: 'rick', name: 'Rick', relation: 'Cousin', desc: 'Rick is Greg and Ella\'s cousin. Aunt Alice\'s son.', details: 'Rick was born in 2011. He loves playing football.' },
            { id: 'alice', name: 'Alice', relation: 'Aunt', desc: 'Alice is Nathan and Sally\'s daughter, Mary\'s sister.', details: 'Alice is Rick\'s mother and Greg\'s aunt.' },
            { id: 'simone', name: 'Simone', relation: 'Uncle (by marriage)', desc: 'Simone is Alice\'s husband.', details: 'Simone is an architect from Italy.' },
            { id: 'alessio', name: 'Alessio', relation: 'Cousin', desc: 'Alessio is Alice and Simone\'s son.', details: 'Alessio is Rick\'s brother.' },
            { id: 'hugo', name: 'Hugo', relation: 'Grandson / Nephew', desc: 'Hugo is part of the younger generation.', details: 'A lively young family member.' },
            { id: 'olivia', name: 'Olivia', relation: 'Granddaughter', desc: 'Olivia is part of the younger generation.', details: 'A cheerful member of the family.' }
        ];

        // Modules Definition
        const modules = [
            {
                title: "Home: The Time Machine",
                subtitle: "Discover Families, Travel Through Time!",
                time: "0 min (Introduction)",
                teacherNotes: `
                    <h4 class="font-bold text-navy mb-1">Teacher Guide: Introduction (0-2 mins)</h4>
                    <p class="mb-2">Greet students and introduce the lesson theme: families and the past. Explain that today students will become <strong>Family Time Detectives</strong>.</p>
                    <p>Emphasize that all learning materials, exercises, and audio dictation scripts are fully contained within this web media.</p>
                `,
                render: () => `
                    <div class="bg-white rounded-3xl p-6 md:p-10 shadow-sm border border-blue-100 flex flex-col items-center text-center space-y-6 slide-up">
                        <div class="w-24 h-24 bg-gradient-to-br from-navy to-mediumBlue rounded-3xl flex items-center justify-center text-white text-5xl shadow-lg">
                            <i class="fa-solid fa-hourglass-start animate-pulse"></i>
                        </div>
                        <div class="max-w-2xl space-y-3">
                            <span class="bg-warmCream text-navy font-bold px-3 py-1 rounded-full text-xs uppercase tracking-wider">Grade 8 English Learning Media</span>
                            <h2 class="text-3xl md:text-4xl font-extrabold text-navy">THE FAMILY TIME MACHINE</h2>
                            <p class="text-base text-mediumBlue font-semibold">Discover Families, Travel Through Time!</p>
                            <p class="text-gray-600 text-sm leading-relaxed bg-softBlue p-4 rounded-2xl border border-blue-200">
                                "Welcome, Detective! Your mission is to explore a family tree, discover stories from the past, and travel through important years. Complete every mission to become a Family Time Detective!"
                            </p>
                        </div>

                        <!-- Progress Stages -->
                        <div class="w-full max-w-4xl grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-3 text-left">
                            <div class="bg-softBlue p-3 rounded-2xl border border-blue-200 flex items-center space-x-3">
                                <div class="bg-mediumBlue text-white w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0">1</div>
                                <div class="text-xs font-semibold text-navy">Meet the Family (Vocab)</div>
                            </div>
                            <div class="bg-softBlue p-3 rounded-2xl border border-blue-200 flex items-center space-x-3">
                                <div class="bg-mediumBlue text-white w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0">2</div>
                                <div class="text-xs font-semibold text-navy">Family Tree Detective</div>
                            </div>
                            <div class="bg-softBlue p-3 rounded-2xl border border-blue-200 flex items-center space-x-3">
                                <div class="bg-mediumBlue text-white w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0">3</div>
                                <div class="text-xs font-semibold text-navy">Listening Mission</div>
                            </div>
                            <div class="bg-softBlue p-3 rounded-2xl border border-blue-200 flex items-center space-x-3">
                                <div class="bg-mediumBlue text-white w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0">4</div>
                                <div class="text-xs font-semibold text-navy">Master Was & Were</div>
                            </div>
                            <div class="bg-softBlue p-3 rounded-2xl border border-blue-200 flex items-center space-x-3">
                                <div class="bg-mediumBlue text-white w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shrink-0">5</div>
                                <div class="text-xs font-semibold text-navy">Time & Final Challenge</div>
                            </div>
                        </div>

                        <button onclick="app.navigateTo(1)" class="bg-navy hover:bg-blue-900 text-white font-bold px-8 py-4 rounded-2xl text-base shadow-xl transition transform hover:-translate-y-0.5 flex items-center gap-3">
                            <i class="fa-solid fa-play text-warmCream"></i> START THE MISSION
                        </button>
                    </div>
                `
            },
            {
                title: "Module 1: Family Vocabulary",
                subtitle: "Learn and master core family relationship terms",
                time: "5 minutes",
                teacherNotes: `
                    <h4 class="font-bold text-navy mb-1">Teacher Guide: Family Vocabulary (5 mins)</h4>
                    <p class="mb-2">Review vocabulary categories with students (Nuclear family, Grandparents, Extended family). Click cards to reveal Indonesian translations.</p>
                    <p>Have students practice pronunciation out loud in chorus.</p>
                `,
                render: () => {
                    const vocabList = [
                        { en: "father", id: "ayah", cat: "Nuclear Family", ex: "Nathan is Sally's husband." },
                        { en: "mother", id: "ibu", cat: "Nuclear Family", ex: "Mary is Michael's wife." },
                        { en: "parents", id: "orang tua", cat: "Nuclear Family", ex: "Nathan and Sally are parents." },
                        { en: "son", id: "anak laki-laki", cat: "Nuclear Family", ex: "Greg is Mary's son." },
                        { en: "daughter", id: "anak perempuan", cat: "Nuclear Family", ex: "Ella is Greg's sister." },
                        { en: "brother", id: "saudara laki-laki", cat: "Siblings", ex: "Greg is Ella's brother." },
                        { en: "sister", id: "saudara perempuan", cat: "Siblings", ex: "Ella is Greg's sister." },
                        { en: "husband", id: "suami", cat: "Couples", ex: "Nathan is Sally's husband." },
                        { en: "wife", id: "istri", cat: "Couples", ex: "Mary is Michael's wife." },
                        { en: "grandfather", id: "kakek", cat: "Grandparents", ex: "Nathan is the grandfather." },
                        { en: "grandmother", id: "nenek", cat: "Grandparents", ex: "Sally is the grandmother." },
                        { en: "grandparents", id: "kakek dan nenek", cat: "Grandparents", ex: "Nathan and Sally are grandparents." },
                        { en: "uncle", id: "paman", cat: "Extended Family", ex: "Simone is an uncle." },
                        { en: "aunt", id: "bibi", cat: "Extended Family", ex: "Alice is Greg's aunt." },
                        { en: "cousin", id: "sepupu", cat: "Extended Family", ex: "Rick is Greg's cousin." }
                    ];

                    return `
                        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-blue-100 space-y-6 slide-up">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
                                <div>
                                    <h3 class="text-xl font-extrabold text-navy">Core Family Vocabulary</h3>
                                    <p class="text-xs text-gray-500">Click any card to flip and view the Indonesian translation and example sentence.</p>
                                </div>
                                <button onclick="app.showVocabQuickMatch()" class="bg-mediumBlue text-white font-bold px-4 py-2 rounded-xl text-xs hover:bg-blue-600 transition shadow">
                                    <i class="fa-solid fa-gamepad mr-1"></i> Quick Match Activity
                                </button>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4" id="vocabGrid">
                                ${vocabList.map((v, i) => `
                                    <div onclick="app.flipVocab(${i})" id="vocabCard-${i}" class="bg-softBlue p-4 rounded-2xl border border-blue-200 cursor-pointer transition hover:shadow-md flex flex-col justify-between h-32 select-none relative group">
                                        <div class="flex justify-between items-start">
                                            <span class="bg-white/80 text-navy text-[10px] font-bold px-2 py-0.5 rounded-lg">${v.cat}</span>
                                            <i class="fa-solid fa-rotate text-gray-400 text-xs"></i>
                                        </div>
                                        <div class="text-center">
                                            <div class="flex items-center justify-center gap-2"><h4 class="text-lg font-extrabold text-navy" id="vocabText-${i}">${v.en}</h4><button type="button" aria-label="Listen to ${v.en}" title="Listen to pronunciation" onclick="event.stopPropagation(); app.speak(&quot;${v.en}&quot;)" class="bg-white text-mediumBlue rounded-full w-7 h-7 shadow-sm hover:bg-blue-100"><i class="fa-solid fa-volume-high text-xs"></i></button></div>
                                            <p class="text-xs text-mediumBlue font-semibold hidden" id="vocabSub-${i}">${v.id}</p>
                                        </div>
                                        <p class="text-[11px] text-gray-600 italic text-center truncate" id="vocabEx-${i}">"${v.ex}"</p>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
            },
            {
                title: "Module 2: Family Tree Detective",
                subtitle: "Investigate relationships across the family diagram",
                time: "5 minutes",
                teacherNotes: `
                    <h4 class="font-bold text-navy mb-1">Teacher Guide: Family Tree Detective (5 mins)</h4>
                    <p class="mb-2">Display the family members. Click on cards to inspect relationships and example sentences.</p>
                    <p>Conduct the Detective Quiz orally with the class before moving to Listening.</p>
                `,
                render: () => `
                    <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-blue-100 space-y-6 slide-up">
                        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 border-b pb-4">
                            <div>
                                <h3 class="text-xl font-extrabold text-navy">The Family Tree Detective Board</h3>
                                <p class="text-xs text-gray-500">Click on any family member below to examine their background and relationship sentences.</p>
                            </div>
                            <button onclick="app.openDetectiveQuiz()" class="bg-mediumBlue text-white font-bold px-4 py-2 rounded-xl text-xs hover:bg-blue-600 transition shadow">
                                <i class="fa-solid fa-magnifying-glass mr-1"></i> Detective Quiz
                            </button>
                        </div>

                        <!-- Family Member Cards Grid -->
                        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4">
                            ${familyMembers.map(m => `
                                <div onclick="app.inspectMember('${m.id}')" class="bg-softBlue p-4 rounded-2xl border border-blue-200 cursor-pointer hover:bg-blue-100 transition flex flex-col items-center text-center space-y-2 group">
                                    <div class="w-14 h-14 bg-navy text-white rounded-2xl flex items-center justify-center font-bold text-lg shadow group-hover:scale-105 transition">
                                        ${m.name.charAt(0)}
                                    </div>
                                    <div>
                                        <h4 class="font-bold text-navy text-sm">${m.name}</h4>
                                        <p class="text-[11px] text-mediumBlue font-semibold">${m.relation}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `
            },
            {
                title: "Module 3: Listening Mission",
                subtitle: "Teacher Dictation & Comprehension",
                time: "5 minutes",
                teacherNotes: `
                    <h4 class="font-bold text-navy mb-1">Teacher Guide: Listening Mission (5 mins)</h4>
                    <p class="mb-2"><strong>Instructions:</strong> Read the script below aloud twice at a moderate speed. Pause slightly between sentences.</p>
                    <div class="bg-amber-50 p-3 rounded-xl border border-amber-200 my-2 text-xs font-mono">
                        "Hello! This is a story about Nathan and Sally. They were married in nineteen sixty-eight. Nathan was a photographer. Sally was a doctor. They were young when they got married. Their family grew, and their children had their own families."
                    </div>
                    <p>Have students answer questions in their notebooks, then click 'Show Answers' to verify.</p>
                `,
                render: () => {
                    const questions = [
                        { q: "1. When were Nathan and Sally married?", a: "In 1968 (Nineteen sixty-eight)." },
                        { q: "2. Was Nathan a photographer?", a: "Yes, he was." },
                        { q: "3. Was Sally a doctor?", a: "Yes, she was." },
                        { q: "4. Were they young when they got married?", a: "Yes, they were." }
                    ];

                    return `
                        <div class="bg-white rounded-3xl p-6 md:p-8 shadow-sm border border-blue-100 space-y-6 slide-up">
                            <div class="border-b pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div>
                                    <h3 class="text-xl font-extrabold text-navy">Listening Comprehension Task</h3>
                                    <p class="text-xs text-gray-500">Teacher will read the story aloud. Listen carefully and answer the questions.</p>
                                </div>
                                <div class="flex gap-2">
                                    <button onclick="app.showTeacherDictation()" class="bg-amber-100 text-amber-800 px-3 py-2 rounded-xl text-xs font-bold hover:bg-amber-200 transition">
                                        <i class="fa-solid fa-scroll mr-1"></i> View Script in Teacher Mode
                                    </button>
                                </div>
                            </div>

                            <div class="bg-softBlue p-5 rounded-2xl border border-blue-200 space-y-3">
                                <div class="flex items-center gap-2 text-navy font-bold text-sm">

            speak(text) {
                if (!("speechSynthesis" in window) || !("SpeechSynthesisUtterance" in window)) {
                    this.showMessage("Audio is not supported", "Browser ini belum mendukung fitur suara. Coba buka media menggunakan Google Chrome atau Microsoft Edge versi terbaru.");
                    return;
                }
                if (!text || !String(text).trim()) return;
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(String(text).trim());
                const voices = window.speechSynthesis.getVoices();
                const englishVoices = voices.filter(v => /^en(-|_)/i.test(v.lang));
                const preferredVoice = englishVoices.find(v => /en-GB/i.test(v.lang)) || englishVoices.find(v => /en-US/i.test(v.lang)) || englishVoices[0];
                if (preferredVoice) utterance.voice = preferredVoice;
                utterance.lang = preferredVoice ? preferredVoice.lang : "en-GB";
                utterance.rate = 0.88;
                utterance.pitch = 1;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
            },
            stopSpeaking() {
                if ("speechSynthesis" in window) window.speechSynthesis.cancel();
            },
            speakYear(year) {
                const pronunciations = {
                    "1945": "nineteen forty-five", "1968": "nineteen sixty-eight",
                    "1989": "nineteen eighty-nine", "1999": "nineteen ninety-nine",
                    "2000": "two thousand", "2002": "two thousand and two",
                    "2009": "two thousand and nine", "2010": "two thousand and ten, or twenty ten",
                    "2011": "two thousand and eleven, or twenty eleven", "2026": "twenty twenty-six"
                };
                this.speak(pronunciations[year] || String(year));
            },
            init() {
                this.render();
            },
            navigateTo(modIdx) {
                if (modIdx < 0 || modIdx >= modules.length) return;
                state.currentModule = modIdx;
                this.render();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },
            nextModule() {
                if (state.currentModule < modules.length - 1) {
                    this.navigateTo(state.currentModule + 1);
                }
            },
            prevModule() {
                if (state.currentModule > 0) {
                    this.navigateTo(state.currentModule - 1);
                }
            },
            render() {
                const mod = modules[state.currentModule];
                
                // Update Status Bar
                document.getElementById('moduleBadge').innerText = `Module ${state.currentModule} / 8`;
                document.getElementById('moduleTitleHeader').innerText = mod.title;
                document.getElementById('moduleTimeHeader').innerHTML = `<i class="fa-regular fa-clock mr-1"></i> Estimated Time: ${mod.time}`;
                
                // Update Nav Buttons
                document.getElementById('prevBtn').disabled = state.currentModule === 0;
                document.getElementById('prevBtn').classList.toggle('opacity-50', state.currentModule === 0);
                document.getElementById('nextBtn').disabled = state.currentModule === modules.length - 1;
                document.getElementById('nextBtn').classList.toggle('opacity-50', state.currentModule === modules.length - 1);

                // Highlight active nav in header
                document.querySelectorAll('.nav-btn').forEach(btn => {
                    const m = parseInt(btn.getAttribute('data-mod'));
                    if (m === state.currentModule) {
                        btn.className = 'nav-btn px-3 py-1.5 rounded-lg transition bg-white/30 font-bold shadow-inner';
                    } else {
                        btn.className = 'nav-btn px-3 py-1.5 rounded-lg transition hover:bg-white/20';
                    }
                });

                // Render Main Content
                document.getElementById('mainContent').innerHTML = mod.render();

                // Render Teacher Modal Content
                document.getElementById('teacherModalContent').innerHTML = mod.teacherNotes;
            },
            toggleTeacherMode() {
                state.teacherModeOpen = !state.teacherModeOpen;
                const modal = document.getElementById('teacherModal');
                modal.classList.toggle('hidden', !state.teacherModeOpen);
            },
            togglePresentMode() {
                state.presentMode = !state.presentMode;
                const header = document.getElementById('mainHeader');
                const btnText = document.getElementById('presentModeBtnText');
                if (state.presentMode) {
                    header.classList.add('hidden');
                    btnText.innerText = "Exit Present";
                } else {
                    header.classList.remove('hidden');
                    btnText.innerText = "Present";
                }
            },
            // Create a print-ready student worksheet in a separate window.
            // The interactive MPI remains unchanged; only the worksheet is sent to print.
            printLKM() {
                const worksheet = `
                    <!DOCTYPE html>
                    <html lang="en">
                    <head>
                        <meta charset="UTF-8">
                        <meta name="viewport" content="width=device-width, initial-scale=1.0">
                        <title>Student Worksheet - The Family Time Machine</title>
                        <style>
                            * { box-sizing: border-box; }
                            body { font-family: Arial, sans-serif; color: #172b45; margin: 0; padding: 24px; font-size: 12px; line-height: 1.45; }
                            .sheet { max-width: 800px; margin: 0 auto; }
                            h1 { font-size: 21px; text-align: center; margin: 0 0 3px; letter-spacing: .4px; }
                            .subtitle { text-align: center; font-size: 12px; margin: 0 0 16px; }
                            .identity { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; margin: 14px 0 18px; }
                            .line { border-bottom: 1px solid #333; min-height: 20px; display: inline-block; min-width: 150px; }
                            h2 { font-size: 14px; background: #e5f1ff; padding: 6px 8px; border-left: 4px solid #477db3; margin: 15px 0 8px; }
                            p { margin: 5px 0; }
                            .question { margin: 8px 0 10px; }
                            .answer { border-bottom: 1px solid #777; height: 22px; margin-top: 4px; }
                            .short { display: inline-block; border-bottom: 1px solid #777; min-width: 115px; height: 18px; }
                            .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 22px; }
                            table { border-collapse: collapse; width: 100%; margin: 8px 0; }
                            th, td { border: 1px solid #777; padding: 6px; text-align: left; }
                            th { background: #f2f6fb; }
                            .footer { margin-top: 18px; font-size: 10px; text-align: center; color: #555; }
                            @media print { body { padding: 0; } .sheet { max-width: none; } }
                        </style>
                    </head>
                    <body>
                      <main class="sheet">
                        <h1>THE FAMILY TIME MACHINE</h1>
                        <p class="subtitle">Grade 8 English | Student Worksheet (LKM)</p>
                        <div class="identity">
                          <div>Name: <span class="line"></span></div>
                          <div>Class: <span class="line"></span></div>
                          <div>Date: <span class="line"></span></div>
                          <div>Score: <span class="line"></span></div>
                        </div>

                        <p><strong>Learning Goals:</strong> Identify family relationships, use <em>was/were</em> correctly, and read years in English.</p>

                        <h2>A. Family Vocabulary</h2>
                        <p>Complete the Indonesian meaning of each word.</p>
                        <table>
                          <tr><th>No.</th><th>English</th><th>Indonesian Meaning</th></tr>
                          <tr><td>1</td><td>grandfather</td><td></td></tr>
                          <tr><td>2</td><td>grandmother</td><td></td></tr>
                          <tr><td>3</td><td>daughter</td><td></td></tr>
                          <tr><td>4</td><td>uncle</td><td></td></tr>
                          <tr><td>5</td><td>cousin</td><td></td></tr>
                        </table>

                        <h2>B. Family Tree Detective</h2>
                        <p>Answer the questions based on the family story and the MPI.</p>
                        <div class="question">1. Who is Greg's mother?<div class="answer"></div></div>
                        <div class="question">2. Who is Ella's brother?<div class="answer"></div></div>
                        <div class="question">3. Who is Nathan's wife?<div class="answer"></div></div>

                        <h2>C. Grammar Lab: Was or Were?</h2>
                        <p>Choose the correct form to complete each sentence.</p>
                        <div class="question">1. My grandmother <span class="short"></span> a teacher.</div>
                        <div class="question">2. My parents <span class="short"></span> young in 2000.</div>
                        <div class="question">3. Nathan <span class="short"></span> a photographer.</div>
                        <div class="question">4. Ella and Rick <span class="short"></span> friends.</div>
                        <div class="question">5. I <span class="short"></span> at school yesterday.</div>
                        <p><strong>Make it negative:</strong> They were friends. → <span class="line"></span></p>
                        <p><strong>Make it a question:</strong> She was a doctor. → <span class="line"></span></p>

                        <h2>D. Years and Dates</h2>
                        <p>Write these years in English words.</p>
                        <div class="two-col">
                          <div>1. 1945: <span class="line"></span></div>
                          <div>2. 1968: <span class="line"></span></div>
                          <div>3. 2000: <span class="line"></span></div>
                          <div>4. 2026: <span class="line"></span></div>
                        </div>

                        <h2>E. Listening Mission</h2>
                        <p>Listen to your teacher and answer the questions.</p>
                        <div class="question">1. When were Nathan and Sally married?<div class="answer"></div></div>
                        <div class="question">2. Was Nathan a photographer?<div class="answer"></div></div>
                        <div class="question">3. Was Sally a doctor?<div class="answer"></div></div>

                        <h2>F. Speaking & Reflection</h2>
                        <p>Complete the sentences about your family. You may use a fictional example if you prefer.</p>
                        <p>1. My grandfather was born in <span class="short"></span>.</p>
                        <p>2. My parents were young in <span class="short"></span>.</p>
                        <p>3. One new word I learned today is <span class="short"></span>.</p>
                        <p>4. We use <em>was</em> with <span class="line"></span> and <em>were</em> with <span class="line"></span>.</p>

                        <div class="footer">The Family Time Machine | Grade 8 English Learning Media</div>
                      </main>
                      <script>window.addEventListener('load', function(){ window.focus(); window.print(); });<\/script>
                    </body>
                    </html>`;
                const printWindow = window.open('', '_blank');
                if (!printWindow) {
                    this.showMessage("Print window blocked", "Izinkan pop-up untuk media ini, lalu klik Cetak LKM kembali.");
                    return;
                }
                printWindow.document.open();
                printWindow.document.write(worksheet);
                printWindow.document.close();
            },
            showMessage(title, body) {
                document.getElementById('msgTitle').innerText = title;
                document.getElementById('msgBody').innerText = body;
                document.getElementById('messageModal').classList.remove('hidden');
            },
            closeMessage() {
                document.getElementById('messageModal').classList.add('hidden');
            },
            flipVocab(idx) {
                const textElem = document.getElementById(`vocabText-${idx}`);
                const subElem = document.getElementById(`vocabSub-${idx}`);
                const exElem = document.getElementById(`vocabEx-${idx}`);
                
                if (subElem.classList.contains('hidden')) {
                    subElem.classList.remove('hidden');
                } else {
                    subElem.classList.add('hidden');
                }
            },
            showVocabQuickMatch() {
                this.showMessage("Quick Match Activity", "Teacher can ask students to match English family words with Indonesian meanings out loud across the classroom.");
            },
            inspectMember(id) {
                const member = familyMembers.find(m => m.id === id);
                if (member) {
                    this.showMessage(member.name + " (" + member.relation + ")", member.desc + "\n\nDetails: " + member.details);
                }
            },
            openDetectiveQuiz() {
                this.showMessage("Detective Quiz Time", "Teacher asks the class: 1. Who is Greg's mother? (Mary) 2. Who is Mary's son? (Greg) 3. Who is Ella's brother? (Greg) 4. Who is Nathan's wife? (Sally)");
            },
            showTeacherDictation() {
                this.toggleTeacherMode();
            },
            toggleListeningAnswers() {
                const boxes = document.querySelectorAll('.answer-box');
                const btn = document.getElementById('revealListeningBtn');
                boxes.forEach(b => b.classList.toggle('hidden'));
                if (btn.innerText === "Show Answers") {
                    btn.innerText = "Hide Answers";
                } else {
                    btn.innerText = "Show Answers";
                }
            },
            checkGrammarPractice() {
                const l1_1 = document.getElementById('g1_1').value;
                const l1_2 = document.getElementById('g1_2').value;
                const l1_3 = document.getElementById('g1_3').value;
                const l1_4 = document.getElementById('g1_4').value;
                const l1_5 = document.getElementById('g1_5').value;

                let score = 0;
                if (l1_1 === 'was') score++;
                if (l1_2 === 'were') score++;
                if (l1_3 === 'was') score++;
                if (l1_4 === 'were') score++;
                if (l1_5 === 'was') score++;

                const fb = document.getElementById('grammarFeedback');
                fb.classList.remove('hidden');
                fb.className = `p-4 rounded-xl text-xs font-bold ${score === 5 ? 'bg-green-100 text-green-800' : 'bg-amber-100 text-amber-800'}`;
                fb.innerText = `Grammar Practice Score: ${score} / 5 correct! Correct answers: 1. was, 2. were, 3. was, 4. were, 5. was.`;
            },
            revealYear(year) {
                const elem = document.getElementById(`y-text-${year}`);
                const pronunciations = {
                    "1945": "nineteen forty-five",
                    "1968": "nineteen sixty-eight",
                    "1989": "nineteen eighty-nine",
                    "1999": "nineteen ninety-nine",
                    "2000": "two thousand",
                    "2002": "two thousand and two",
                    "2009": "two thousand and nine",
                    "2010": "two thousand and ten / twenty ten",
                    "2011": "two thousand and eleven / twenty eleven",
                    "2026": "twenty twenty-six"
                };
                elem.innerText = pronunciations[year] || year;
                elem.classList.add('text-mediumBlue', 'font-bold');
            },
            revealSpeakingExample() {
                const box = document.getElementById('speakingExampleBox');
                box.classList.toggle('hidden');
            },
            selectQuizAnswer(qId, optIdx) {
                state.quizAnswers[qId] = optIdx;
                // re-render current module to update button styles
                this.render();
            },
            submitQuiz() {
                state.quizSubmitted = true;
                this.render();
            },
            restartQuiz() {
                state.quizAnswers = {};
                state.quizSubmitted = false;
                this.render();
            }
        };

        // Initialize on load
        window.onload = () => {
            app.init();
        };
    </script>
</body>
